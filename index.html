<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrbitLive - Flight Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Proje CSS Dosyası -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <div id="top-bar">
        <div class="logo">OrbitLive</div>
        
        <!-- Tekli Arama Çubuğu -->
        <input type="text" id="topSearch" class="search-input" placeholder="Search Callsign or Pilot..." oninput="applyFilters()">

        <!-- Sunucu Seçimi -->
        <select id="serverDropdown" class="top-select" onchange="applyFilters()">
            <option value="ALL">All Servers</option>
        </select>

        <button class="top-btn" onclick="toggleFilterModal()">🔍 Filters</button>
        <button class="top-btn" onclick="toggleSettingsModal()">⚙️ Settings</button>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
        <div id="map"></div>
        <canvas id="flight-canvas"></canvas>
    </div>

    <!-- ADVANCED FILTERS MODAL (Gelişmiş Filtreleme Panosu) -->
    <div id="filter-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleFilterModal()">&times;</span>
            <h2>Fleet Board & Filters</h2>
            
            <div class="filter-row">
                <div class="filter-group">
                    <label>ORIGIN (ICAO)</label>
                    <input type="text" id="fltOrigin" placeholder="e.g. KLAX">
                </div>
                <div class="filter-group">
                    <label>DESTINATION (ICAO)</label>
                    <input type="text" id="fltDest" placeholder="e.g. EGLL">
                </div>
            </div>

            <div class="filter-group full-width">
                <label>AIRPORT (IN + OUT)</label>
                <input type="text" id="fltAirport" placeholder="e.g. EDDF">
            </div>

            <div class="filter-group full-width">
                <label>LIVERY</label>
                <input type="text" id="fltLivery" placeholder="e.g. KLM">
            </div>

            <div class="filter-group full-width">
                <label>CALLSIGN</label>
                <input type="text" id="fltCallsign" placeholder="e.g. KLM123">
            </div>

            <div class="filter-group full-width">
                <label>VIRTUAL AIRLINE (VA)</label>
                <input type="text" id="fltVA" placeholder="e.g. American Virtual">
            </div>

            <div class="filter-group full-width">
                <label>PILOT (USERNAME)</label>
                <input type="text" id="fltPilot" placeholder="e.g. laura">
            </div>

            <button class="apply-btn" onclick="applyFilters()">Search</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleSettingsModal()">&times;</span>
            <h2>Radar Settings</h2>
            
            <div class="filter-group full-width">
                <label>AIRCRAFT COLOR</label>
                <input type="color" id="planeColorPicker" value="#00F5D4" onchange="updateSettings()">
            </div>
            
            <div class="filter-group full-width" style="margin-top: 15px;">
                <label>AIRCRAFT LABEL</label>
                <select id="planeLabelSelect" onchange="updateSettings()">
                    <option value="NONE">None (Icon Only)</option>
                    <option value="CALLSIGN" selected>Callsign</option>
                    <option value="USERNAME">Username</option>
                    <option value="VA">Virtual Airline</option>
                    <option value="LIVERY">Livery</option>
                </select>
            </div>
        </div>
    </div>

    <!-- SELECTED FLIGHT INFO PANEL (Tıklanan Uçağın Bilgi Kartı) -->
    <div id="flight-info-panel" class="info-panel hidden">
        <span class="close-btn" onclick="closeInfoPanel()">&times;</span>
        <div class="info-header" id="ui-callsign">---</div>
        <div class="info-grid">
            <div class="info-item"><span class="label">PILOT</span><span class="value" id="ui-username">---</span></div>
            <div class="info-item"><span class="label">VA</span><span class="value" id="ui-va">---</span></div>
            <div class="info-item"><span class="label">AIRCRAFT</span><span class="value" id="ui-aircraft">---</span></div>
            <div class="info-item"><span class="label">ALTITUDE</span><span class="value" id="ui-alt">--- ft</span></div>
            <div class="info-item"><span class="label">SPEED</span><span class="value" id="ui-speed">--- kts</span></div>
            <div class="info-item"><span class="label">ORIGIN</span><span class="value loading" id="ui-origin">Loading...</span></div>
            <div class="info-item"><span class="label">DESTINATION</span><span class="value loading" id="ui-dest">Loading...</span></div>
            <div class="info-item"><span class="label">SERVER</span><span class="value server-text" id="ui-server">---</span></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
