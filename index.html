<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrbitLive - Profesyonel Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* HARİTA & CANVAS */
        #map-container { position: relative; width: 100%; height: calc(100vh - 60px); margin-top: 60px; }
        #map { width: 100%; height: 100%; z-index: 1; }
        #flight-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; }

        /* YENİ: SABİT ÜST MENÜ (TOP BAR) */
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(20, 20, 20, 0.95); display: flex; align-items: center;
            padding: 0 20px; box-sizing: border-box; z-index: 2000;
            border-bottom: 2px solid #00bbff; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); gap: 15px; color: white;
        }
        .logo { font-size: 22px; font-weight: 900; color: #00bbff; letter-spacing: 1px; margin-right: auto; text-shadow: 0 0 10px rgba(0,187,255,0.5); }
        
        .top-select {
            background: #2a2a2a; color: white; border: 1px solid #444; 
            padding: 8px 12px; border-radius: 6px; outline: none; cursor: pointer; font-size: 13px;
        }
        .top-btn {
            background: #2a2a2a; color: white; border: 1px solid #444; 
            padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            transition: all 0.3s; font-size: 13px;
        }
        .top-btn:hover { background: #00bbff; color: black; border-color: #00bbff; box-shadow: 0 0 10px rgba(0,187,255,0.5); }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-disabled:hover { background: #2a2a2a; color: white; border-color: #444; box-shadow: none; }

        /* AYARLAR MENÜSÜ (TAM EKRAN) */
        #settings-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.98); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; padding: 20px; box-sizing: border-box;
        }
        #settings-modal.active { display: flex; }
        #settings-modal h2 { margin-bottom: 30px; color: #00bbff; font-size: 28px; }
        .setting-item { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 25px; width: 320px;}
        .setting-item label { font-size: 16px; font-weight: bold; color: #ccc; }
        .setting-item select, .setting-item input[type="color"] {
            width: 100%; padding: 12px; font-size: 15px; border-radius: 6px; border: none; outline: none; cursor: pointer; background: #333; color: white;
        }
        .close-settings { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; color: #aaa; }
        .close-settings:hover { color: white; }

        /* ALT BİLGİ ÇUBUĞU */
        #bottom-bar {
            position: fixed; bottom: -250px; left: 0; width: 100%; min-height: 150px;
            background: rgba(15, 15, 15, 0.95); color: #fff; z-index: 1000;
            transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-top: 3px solid #00bbff;
            padding: 15px 25px 25px 25px; box-sizing: border-box; backdrop-filter: blur(10px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        #bottom-bar.active { bottom: 0; }
        .bar-close { position: absolute; top: 10px; right: 20px; font-size: 28px; cursor: pointer; color: #aaa; }
        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; width: 95%; margin-top: 5px; }
        .info-box { display: flex; flex-direction: column; }
        .callsign { font-size: 24px; font-weight: bold; color: #00bbff; text-shadow: 0 0 5px rgba(0,187,255,0.3); }
        .label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .value { font-size: 16px; color: #eee; }
        .loading-text { font-style: italic; color: #ffaa00; font-size: 13px; }
    </style>
</head>
<body>

    <!-- ÜST MENÜ (YENİ CANLI TASARIM) -->
    <div id="top-bar">
        <div class="logo">OrbitLive</div>
        
        <select id="layerSelect" class="top-select" onchange="changeMapLayer()">
            <option value="dark">Koyu Tema (Dark)</option>
            <option value="satellite">Uydu (HD)</option>
            <option value="street">Sokaklar</option>
            <option value="terrain">Arazi (Topo)</option>
        </select>

        <select id="serverDropdown" class="top-select" onchange="filterServer()">
            <option value="ALL">Tüm Sunucular</option>
        </select>

        <button class="top-btn" onclick="toggleSettings()">⚙️ Ayarlar</button>
        <button class="top-btn btn-disabled" title="Yakında Eklenecek">📡 ATC (Yakında)</button>
        <button class="top-btn btn-disabled" title="Yakında Eklenecek">👤 Giriş Yap</button>
    </div>

    <!-- HARİTA -->
    <div id="map-container">
        <div id="map"></div>
        <canvas id="flight-canvas"></canvas>
    </div>

    <!-- AYARLAR MENÜSÜ -->
    <div id="settings-modal">
        <span class="close-settings" onclick="toggleSettings()">&times;</span>
        <h2>Arayüz Ayarları</h2>
        
        <div class="setting-item">
            <label>Uçak Rengi</label>
            <input type="color" id="planeColorPicker" value="#ffffff" onchange="updateSettings()">
        </div>
        
        <div class="setting-item">
            <label>Uçak Üzerinde Ne Yazsın?</label>
            <select id="planeLabelSelect" onchange="updateSettings()">
                <option value="NONE">Hiçbir Şey (Sadece Uçak)</option>
                <option value="CALLSIGN">Çağrı Kodu (Callsign)</option>
                <option value="USERNAME">Kullanıcı Adı</option>
                <option value="VA">Havayolu Şirketi (Virtual Airline)</option>
                <option value="LIVERY">Uçak Boyaması (Livery)</option> <!-- YENİ EKLENDİ -->
            </select>
        </div>
    </div>

    <!-- ALT BİLGİ ÇUBUĞU -->
    <div id="bottom-bar">
        <span class="bar-close" onclick="closeBottomBar()">&times;</span>
        <div class="grid-info">
            <div class="info-box"><span class="label">Callsign</span><span class="callsign" id="ui-callsign">---</span></div>
            <div class="info-box"><span class="label">Pilot</span><span class="value" id="ui-username">---</span></div>
            <div class="info-box"><span class="label">Havayolu (VA)</span><span class="value" id="ui-va">---</span></div>
            <div class="info-box"><span class="label">Uçak / Livery</span><span class="value" id="ui-aircraft">---</span></div>
            <div class="info-box"><span class="label">İrtifa</span><span class="value" id="ui-alt">--- ft</span></div>
            <div class="info-box"><span class="label">Hız</span><span class="value" id="ui-speed">--- kts</span></div>
            <div class="info-box"><span class="label">Kalkış Yeri</span><span class="value" id="ui-origin" style="color: #ffaa00;">Yükleniyor...</span></div>
            <div class="info-box"><span class="label">Varış Yeri</span><span class="value" id="ui-dest" style="color: #ffaa00;">Yükleniyor...</span></div>
            <div class="info-box"><span class="label">Sunucu</span><span class="value" id="ui-server" style="color: #00ff88;">---</span></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
        // ==========================================
        // 1. HARİTA VE KATMAN KURULUMU
        // ==========================================
        const map = L.map('map', { center: [39.0, 35.0], zoom: 5, minZoom: 3, zoomControl: false });
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Farklı Harita Katmanları
        const mapLayers = {
            "dark": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }),
            "satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
            "street": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
            "terrain": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 })
        };
        
        let currentMapLayer = mapLayers["dark"];
        currentMapLayer.addTo(map);

        // Üst Menüden Katman Değiştirme Fonksiyonu
        function changeMapLayer() {
            const selected = document.getElementById("layerSelect").value;
            map.removeLayer(currentMapLayer);
            currentMapLayer = mapLayers[selected];
            currentMapLayer.addTo(map);
        }

        // ==========================================
        // 2. CANVAS VE AYARLAR
        // ==========================================
        const canvas = document.getElementById('flight-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        let userColor = "#ffffff";
        let userLabel = "NONE";
        let planeImg = new Image();

        function updateSettings() {
            userColor = document.getElementById("planeColorPicker").value;
            userLabel = document.getElementById("planeLabelSelect").value;
            const svgColor = encodeURIComponent(userColor); 
            planeImg.src = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='${svgColor}'%3E%3Cpath d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E`;
        }
        updateSettings();

        // ==========================================
        // 3. SUNUCU BAĞLANTISI VE VERİ YÖNETİMİ
        // ==========================================
        let flights = {}; 
        let selectedFlightId = null; 
        let currentFilter = "ALL";
        let knownServers = [];

        // KENDİ BACKEND URL'Nİ YAZ
        const socket = io("orbitlive-9v23ykd1.b4a.run");

        socket.on('flightDataUpdate', (data) => {
            if (!data) return;
            if (data.servers && data.servers.length !== knownServers.length) {
                knownServers = data.servers;
                const dropdown = document.getElementById("serverDropdown");
                dropdown.innerHTML = '<option value="ALL">Tüm Sunucular</option>';
                knownServers.forEach(s => dropdown.innerHTML += `<option value="${s}">${s}</option>`);
                dropdown.value = currentFilter;
            }

            const currentIds = new Set();
            data.result.forEach(f => {
                currentIds.add(f.flightId);
                if (flights[f.flightId]) {
                    Object.assign(flights[f.flightId], {
                        targetLat: f.latitude, targetLng: f.longitude, heading: f.heading, altitude: f.altitude, speed: f.speed
                    });
                    
                    // İrtifa çizgisi (Kuyruk) için geçmişi kaydet. (Performans için max 30 nokta / yaklaşık 7.5 dakika uçuş izi)
                    const history = flights[f.flightId].history;
                    const lastPoint = history[history.length - 1];
                    // Sadece uçak gerçekten yer değiştirdiyse yeni nokta ekle
                    if (lastPoint.lat !== f.latitude || lastPoint.lng !== f.longitude) {
                        history.push({ lat: f.latitude, lng: f.longitude, alt: f.altitude });
                        if (history.length > 30) history.shift();
                    }

                    if (selectedFlightId === f.flightId) updateBottomBar(flights[f.flightId], false);
                } else {
                    flights[f.flightId] = {
                        id: f.flightId, sessionId: f.sessionId, callsign: f.callsign, username: f.username, 
                        virtualOrg: f.virtualOrganization, serverName: f.serverName, 
                        aircraftName: f.aircraftName, liveryName: f.liveryName,
                        targetLat: f.latitude, targetLng: f.longitude, lat: f.latitude, lng: f.longitude,
                        heading: f.heading, altitude: f.altitude, speed: f.speed,
                        history: [{ lat: f.latitude, lng: f.longitude, alt: f.altitude }]
                    };
                }
            });

            Object.keys(flights).forEach(id => {
                if (!currentIds.has(id)) {
                    delete flights[id];
                    if (selectedFlightId === id) closeBottomBar(); 
                }
            });
        });

        // Uçuş Planı (Kalkış/Varış) verisi geldiğinde
        socket.on('flightDetailsData', (details) => {
            if (details) {
                document.getElementById('ui-origin').innerText = details.originAirport;
                document.getElementById('ui-dest').innerText = details.destinationAirport;
            } else {
                document.getElementById('ui-origin').innerText = "Planlanmadı";
                document.getElementById('ui-dest').innerText = "Planlanmadı";
            }
        });

        // ==========================================
        // 4. İRTİFA RENK KODU VE KAVİSLİ ANİMASYON ÇİZİMİ
        // ==========================================
        function getAltitudeColor(alt) {
            if (alt < 10000) return '#ff3333'; // Kırmızı (Alçak)
            if (alt < 20000) return '#ffaa00'; // Turuncu
            if (alt < 30000) return '#33cc33'; // Yeşil
            return '#00bbff';                  // Mavi (Seyir)
        }

        function drawFlights() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            Object.values(flights).forEach(f => {
                if (currentFilter !== "ALL" && f.serverName !== currentFilter) return;

                f.lat += (f.targetLat - f.lat) * 0.03;
                f.lng += (f.targetLng - f.lng) * 0.03;

                const pos = map.latLngToContainerPoint([f.lat, f.lng]);
                if (pos.x < -50 || pos.x > canvas.width + 50 || pos.y < -50 || pos.y > canvas.height + 50) return;

                // --- YUMUŞAK VE RENK GEÇİŞLİ İRTİFA ÇİZGİSİ (BEZIER CURVE) ---
                if (f.history.length > 2) {
                    ctx.lineJoin = "round";
                    ctx.lineCap = "round";
                    ctx.lineWidth = 3;

                    for (let i = 1; i < f.history.length - 1; i++) {
                        const p0 = map.latLngToContainerPoint([f.history[i-1].lat, f.history[i-1].lng]);
                        const p1 = map.latLngToContainerPoint([f.history[i].lat, f.history[i].lng]);
                        const p2 = map.latLngToContainerPoint([f.history[i+1].lat, f.history[i+1].lng]);

                        // Yumuşatmak için orta noktaları (Midpoints) buluyoruz
                        const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
                        const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

                        ctx.beginPath();
                        ctx.moveTo(mid1.x, mid1.y);
                        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y); // Kavisli dönüş (Daire/Hold için mükemmel)

                        // RGB Renk Geçişi (Gradient)
                        const grad = ctx.createLinearGradient(mid1.x, mid1.y, mid2.x, mid2.y);
                        grad.addColorStop(0, getAltitudeColor(f.history[i-1].alt));
                        grad.addColorStop(1, getAltitudeColor(f.history[i].alt));
                        
                        ctx.strokeStyle = grad;
                        ctx.globalAlpha = 0.7; // Hafif şeffaf
                        ctx.stroke();
                    }

                    // Çizgiyi mevcut animasyonlu uçağın poposuna bağla
                    const lastP = f.history[f.history.length - 1];
                    const prevP = f.history[f.history.length - 2];
                    const p1 = map.latLngToContainerPoint([prevP.lat, prevP.lng]);
                    const p2 = map.latLngToContainerPoint([lastP.lat, lastP.lng]);
                    const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

                    ctx.beginPath();
                    ctx.moveTo(mid.x, mid.y);
                    ctx.quadraticCurveTo(p2.x, p2.y, pos.x, pos.y);
                    
                    const finalGrad = ctx.createLinearGradient(mid.x, mid.y, pos.x, pos.y);
                    finalGrad.addColorStop(0, getAltitudeColor(lastP.alt));
                    finalGrad.addColorStop(1, getAltitudeColor(f.altitude));
                    
                    ctx.strokeStyle = finalGrad;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }

                // --- UÇAK İKONU VE YAZILAR ---
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(f.heading * Math.PI / 180);
                if (selectedFlightId === f.id) {
                    ctx.beginPath(); ctx.arc(0, 0, 18, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(0, 187, 255, 0.2)"; ctx.fill();
                    ctx.strokeStyle = '#00bbff'; ctx.lineWidth = 2; ctx.stroke();
                }
                ctx.drawImage(planeImg, -14, -14, 28, 28);
                ctx.restore();

                if (userLabel !== "NONE") {
                    let text = "";
                    if (userLabel === "CALLSIGN") text = f.callsign;
                    if (userLabel === "USERNAME") text = f.username || "";
                    if (userLabel === "VA") text = f.virtualOrg || "";
                    if (userLabel === "LIVERY") text = f.liveryName || "";
                    
                    if (text !== "") {
                        ctx.fillStyle = userColor;
                        ctx.font = "bold 11px Arial";
                        ctx.textAlign = "center";
                        ctx.shadowColor = "rgba(0,0,0,0.8)"; 
                        ctx.shadowBlur = 4;
                        ctx.fillText(text, pos.x, pos.y - 20);
                        ctx.shadowBlur = 0; 
                    }
                }
            });
            requestAnimationFrame(drawFlights);
        }
        drawFlights();

        // ==========================================
        // TIKLAMA VE ARAYÜZ YÖNETİMİ
        // ==========================================
        
        map.on('click', function(e) {
            // Tıklanan yerin Üst Menüye (Top Bar) denk gelmesini engelle (ilk 60 piksel)
            if (e.containerPoint.y < 60) return; 

            let clicked = null; 
            let minDistance = 25; // Dokunma hassasiyeti (Mobil için 25 piksel idealdir)
            
            Object.values(flights).forEach(f => {
                // Seçili olmayan sunucudaki uçaklara tıklanmasını engelle
                if (currentFilter !== "ALL" && f.serverName !== currentFilter) return;
                
                const pos = map.latLngToContainerPoint([f.lat, f.lng]);
                // Tıklanan nokta ile uçak arasındaki mesafeyi ölç (Pisagor)
                const dist = Math.sqrt(Math.pow(pos.x - e.containerPoint.x, 2) + Math.pow(pos.y - e.containerPoint.y, 2));
                
                if (dist < minDistance) { 
                    minDistance = dist; 
                    clicked = f; 
                }
            });
            
            if (clicked) { 
                selectedFlightId = clicked.id; 
                updateBottomBar(clicked, true); // Menüyü açarken verileri doldur ve rotayı API'den iste
                openBottomBar(); 
            } else {
                // Boş bir yere tıklandıysa alt çubuğu kapat
                closeBottomBar();
            }
        });

        // Üst menüden sunucu değiştirildiğinde
        function filterServer() { 
            currentFilter = document.getElementById("serverDropdown").value; 
            closeBottomBar(); 
        }
        
        // Ayarlar menüsünü aç/kapat
        function toggleSettings() { 
            document.getElementById('settings-modal').classList.toggle('active'); 
        }
        
        // Alt çubuğu (Bottom Bar) aç
        function openBottomBar() { 
            document.getElementById('bottom-bar').classList.add('active'); 
        }
        
        // Alt çubuğu kapat
        function closeBottomBar() { 
            document.getElementById('bottom-bar').classList.remove('active'); 
            selectedFlightId = null; 
        }
        
        // Alt çubuktaki uçuş bilgilerini (Callsign, Hız, İrtifa vb.) güncelle
        function updateBottomBar(f, requestDetails) {
            document.getElementById('ui-callsign').innerText = f.callsign || "Bilinmiyor";
            document.getElementById('ui-username').innerText = f.username || "Misafir Pilot";
            document.getElementById('ui-va').innerText = f.virtualOrg || "Yok";
            document.getElementById('ui-aircraft').innerText = `${f.aircraftName || "?"} (${f.liveryName || "Bilinmiyor"})`;
            document.getElementById('ui-alt').innerText = Math.round(f.altitude).toLocaleString() + " ft";
            document.getElementById('ui-speed').innerText = Math.round(f.speed) + " kts";
            document.getElementById('ui-server').innerText = f.serverName;

            // Eğer uçağa YENİ tıklandıysa API'den Kalkış/Varış rotasını çekmek için Backend'e haber ver
            if (requestDetails) {
                document.getElementById('ui-origin').innerHTML = '<span class="loading-text">Plan Çekiliyor...</span>';
                document.getElementById('ui-dest').innerHTML = '<span class="loading-text">Plan Çekiliyor...</span>';
                socket.emit('requestFlightDetails', { sessionId: f.sessionId, flightId: f.id });
            }
        }
        </script>
</body>
</html>
