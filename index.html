<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrbitLive - Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; overflow: hidden; font-family: Arial, sans-serif; }
        #map-container { position: relative; width: 100%; height: 100vh; }
        #map { width: 100%; height: 100%; z-index: 1; }
        #flight-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; }

        /* BUTONLAR (SUNUCU VE AYARLAR) */
        #server-selector { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(20,20,20,0.9); color: white; padding: 10px; border-radius: 8px; border: 1px solid #007BFF; }
        #server-selector select { background: #333; color: white; padding: 5px; border: none; outline: none; border-radius: 4px; }
        
        #settings-btn {
            position: absolute; top: 80px; right: 10px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); color: black;
            width: 34px; height: 34px; border-radius: 4px; display: flex;
            align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            border: 2px solid rgba(0,0,0,0.2);
        }

        /* AYARLAR MENÜSÜ (TAM EKRAN) */
        #settings-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.98); z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; padding: 20px; box-sizing: border-box;
        }
        #settings-modal.active { display: flex; }
        #settings-modal h2 { margin-bottom: 30px; color: #007BFF; }
        .setting-item { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 25px; width: 300px;}
        .setting-item label { font-size: 16px; font-weight: bold; }
        .setting-item select, .setting-item input[type="color"] {
            width: 100%; padding: 10px; font-size: 16px; border-radius: 5px; border: none; outline: none; cursor: pointer;
        }
        .close-settings { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; color: #aaa; }
        .close-settings:hover { color: white; }

        /* ALT BİLGİ ÇUBUĞU */
        #bottom-bar {
            position: fixed; bottom: -220px; left: 0; width: 100%; height: auto; min-height: 150px;
            background: rgba(15, 15, 15, 0.95); color: #fff; z-index: 1000;
            transition: bottom 0.4s ease; border-top: 3px solid #007BFF;
            padding: 15px 25px 25px 25px; box-sizing: border-box; backdrop-filter: blur(8px);
        }
        #bottom-bar.active { bottom: 0; }
        .bar-close { position: absolute; top: 10px; right: 20px; font-size: 28px; cursor: pointer; color: #aaa; }
        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; width: 95%; margin-top: 5px; }
        .info-box { display: flex; flex-direction: column; }
        .callsign { font-size: 22px; font-weight: bold; color: #00bbff; }
        .label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 15px; color: #eee; }
        .loading-text { font-style: italic; color: #ffaa00; font-size: 12px; }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <canvas id="flight-canvas"></canvas>
    </div>

    <!-- Üst Kontroller -->
    <div id="server-selector">
        <label for="serverDropdown">Sunucu: </label>
        <select id="serverDropdown" onchange="filterServer()">
            <option value="ALL">Tüm Sunucular</option>
        </select>
    </div>
    
    <div id="settings-btn" onclick="toggleSettings()">⚙️</div>

    <!-- Tam Ekran Ayarlar Menüsü -->
    <div id="settings-modal">
        <span class="close-settings" onclick="toggleSettings()">&times;</span>
        <h2>Harita Ayarları</h2>
        
        <div class="setting-item">
            <label>Uçak Rengi</label>
            <input type="color" id="planeColorPicker" value="#ffffff" onchange="updateSettings()">
        </div>
        
        <div class="setting-item">
            <label>Uçak Üzerinde Ne Yazsın?</label>
            <select id="planeLabelSelect" onchange="updateSettings()">
                <option value="NONE">Hiçbir Şey (Sadece Uçak)</option>
                <option value="CALLSIGN">Çağrı Kodu (Callsign)</option>
                <option value="USERNAME">Kullanıcı Adı</option>
                <option value="VA">Havayolu Şirketi (Virtual Airline)</option>
            </select>
        </div>
    </div>

    <!-- Alt Bilgi Çubuğu -->
    <div id="bottom-bar">
        <span class="bar-close" onclick="closeBottomBar()">&times;</span>
        <div class="grid-info">
            <div class="info-box"><span class="label">Callsign</span><span class="callsign" id="ui-callsign">---</span></div>
            <div class="info-box"><span class="label">Pilot</span><span class="value" id="ui-username">---</span></div>
            <div class="info-box"><span class="label">Havayolu (VA)</span><span class="value" id="ui-va">---</span></div>
            <div class="info-box"><span class="label">Uçak / Livery</span><span class="value" id="ui-aircraft">---</span></div>
            <div class="info-box"><span class="label">İrtifa</span><span class="value" id="ui-alt">--- ft</span></div>
            <div class="info-box"><span class="label">Hız</span><span class="value" id="ui-speed">--- kts</span></div>
            <div class="info-box"><span class="label">Kalkış</span><span class="value" id="ui-origin" style="color: #ffaa00;">Yükleniyor...</span></div>
            <div class="info-box"><span class="label">Varış</span><span class="value" id="ui-dest" style="color: #ffaa00;">Yükleniyor...</span></div>
            <div class="info-box"><span class="label">Sunucu</span><span class="value" id="ui-server" style="color: #00ff88;">---</span></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
        // HARİTA KURULUMU
        const map = L.map('map', { center: [39.0, 35.0], zoom: 5, minZoom: 3, zoomControl: false });
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);

        // CANVAS KURULUMU
        const canvas = document.getElementById('flight-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        // KULLANICI AYARLARI
        let userColor = "#ffffff";
        let userLabel = "NONE";
        let planeImg = new Image();

        // Uçak rengini SVG içerisine yedirip günceller
        function updateSettings() {
            userColor = document.getElementById("planeColorPicker").value;
            userLabel = document.getElementById("planeLabelSelect").value;
            const svgColor = encodeURIComponent(userColor); // Rengi URL formatına çevir (Örn: #ff0000 -> %23ff0000)
            planeImg.src = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='${svgColor}'%3E%3Cpath d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E`;
        }
        updateSettings();

        // DEĞİŞKENLER
        let flights = {}; 
        let selectedFlightId = null; 
        let currentFilter = "ALL";
        let knownServers = [];

        // SOCKET.IO BAĞLANTISI (Kendi linkini yazmayı unutma!)
        const socket = io("https://orbitlive-75vteuay.b4a.run");

        socket.on('flightDataUpdate', (data) => {
            if (!data) return;
            if (data.servers && data.servers.length !== knownServers.length) {
                knownServers = data.servers;
                const dropdown = document.getElementById("serverDropdown");
                dropdown.innerHTML = '<option value="ALL">Tüm Sunucular</option>';
                knownServers.forEach(s => dropdown.innerHTML += `<option value="${s}">${s}</option>`);
                dropdown.value = currentFilter;
            }

            const currentIds = new Set();
            data.result.forEach(f => {
                currentIds.add(f.flightId);
                if (flights[f.flightId]) {
                    Object.assign(flights[f.flightId], {
                        targetLat: f.latitude, targetLng: f.longitude, heading: f.heading, altitude: f.altitude, speed: f.speed
                    });
                    if (selectedFlightId === f.flightId) updateBottomBar(flights[f.flightId], false); // Sadece sayıları güncelle
                } else {
                    flights[f.flightId] = {
                        id: f.flightId, userId: f.userId, callsign: f.callsign, username: f.username, 
                        virtualOrg: f.virtualOrganization, serverName: f.serverName, 
                        aircraftName: f.aircraftName, liveryName: f.liveryName,
                        targetLat: f.latitude, targetLng: f.longitude, lat: f.latitude, lng: f.longitude,
                        heading: f.heading, altitude: f.altitude, speed: f.speed
                    };
                }
            });

            Object.keys(flights).forEach(id => {
                if (!currentIds.has(id)) {
                    delete flights[id];
                    if (selectedFlightId === id) closeBottomBar(); 
                }
            });
        });

        // Backend'den Detaylı Rota (Kalkış/Varış) Geldiğinde
        socket.on('flightDetailsData', (details) => {
            if (details) {
                document.getElementById('ui-origin').innerText = details.originAirport || "Bilinmiyor";
                document.getElementById('ui-dest').innerText = details.destinationAirport || "Bilinmiyor";
            } else {
                document.getElementById('ui-origin').innerText = "Rota Yok";
                document.getElementById('ui-dest').innerText = "Rota Yok";
            }
        });

        // CANVAS ANİMASYON ÇİZİMİ
        function drawFlights() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            Object.values(flights).forEach(f => {
                if (currentFilter !== "ALL" && f.serverName !== currentFilter) return;

                f.lat += (f.targetLat - f.lat) * 0.03;
                f.lng += (f.targetLng - f.lng) * 0.03;

                const pos = map.latLngToContainerPoint([f.lat, f.lng]);
                if (pos.x < -50 || pos.x > canvas.width + 50 || pos.y < -50 || pos.y > canvas.height + 50) return;

                // 1. Uçağı Çiz (Döndürerek)
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(f.heading * Math.PI / 180);
                ctx.drawImage(planeImg, -12, -12, 24, 24);
                ctx.restore();

                // 2. Seçili Ayara Göre Uçağın Üzerine Yazı Çiz (Düz durması için restore() sonrası yapıyoruz)
                if (userLabel !== "NONE") {
                    let text = "";
                    if (userLabel === "CALLSIGN") text = f.callsign;
                    if (userLabel === "USERNAME") text = f.username || "";
                    if (userLabel === "VA") text = f.virtualOrg || "";
                    
                    if (text !== "") {
                        ctx.fillStyle = userColor;
                        ctx.font = "bold 12px Arial";
                        ctx.textAlign = "center";
                        ctx.shadowColor = "black"; // Yazı okunabilsin diye siyah gölge
                        ctx.shadowBlur = 4;
                        ctx.fillText(text, pos.x, pos.y - 18);
                        ctx.shadowBlur = 0; // Gölgeyi diğer şeyler için sıfırla
                    }
                }
            });
            requestAnimationFrame(drawFlights);
        }
        drawFlights();

        // TIKLAMA VE ARAYÜZ YÖNETİMİ
        map.on('click', function(e) {
            let clicked = null; let minDistance = 20;
            Object.values(flights).forEach(f => {
                if (currentFilter !== "ALL" && f.serverName !== currentFilter) return;
                const pos = map.latLngToContainerPoint([f.lat, f.lng]);
                const dist = Math.sqrt(Math.pow(pos.x - e.containerPoint.x, 2) + Math.pow(pos.y - e.containerPoint.y, 2));
                if (dist < minDistance) { minDistance = dist; clicked = f; }
            });
            
            if (clicked) { 
                selectedFlightId = clicked.id; 
                updateBottomBar(clicked, true); // Menüyü aç ve veri isteğini gönder
                openBottomBar(); 
            } else {
                closeBottomBar();
            }
        });

        function filterServer() { currentFilter = document.getElementById("serverDropdown").value; closeBottomBar(); }
        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('active'); }
        function openBottomBar() { document.getElementById('bottom-bar').classList.add('active'); }
        function closeBottomBar() { document.getElementById('bottom-bar').classList.remove('active'); selectedFlightId = null; }
        
        function updateBottomBar(f, requestDetails) {
            document.getElementById('ui-callsign').innerText = f.callsign || "Bilinmiyor";
            document.getElementById('ui-username').innerText = f.username || "Misafir Pilot";
            document.getElementById('ui-va').innerText = f.virtualOrg || "Bilinmiyor";
            document.getElementById('ui-aircraft').innerText = `${f.aircraftName || "?"} (${f.liveryName || "Bilinmiyor"})`;
            document.getElementById('ui-alt').innerText = Math.round(f.altitude).toLocaleString() + " ft";
            document.getElementById('ui-speed').innerText = Math.round(f.speed) + " kts";
            document.getElementById('ui-server').innerText = f.serverName;

            // Uçağa ilk tıklandığında Backend'den detayları talep et
            if (requestDetails) {
                document.getElementById('ui-origin').innerHTML = '<span class="loading-text">Yükleniyor...</span>';
                document.getElementById('ui-dest').innerHTML = '<span class="loading-text">Yükleniyor...</span>';
                socket.emit('requestFlightDetails', { userId: f.userId, flightId: f.id });
            }
        }
    </script>
</body>
</html>
