<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitLive OBS Widget</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
        
        /* Arka plan tamamen şeffaf olmalı ki oyunun görüntüsünü kapatmasın */
        body {
            background: transparent !important;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }

        /* Yarı saydam, cam efektli, neon tasarımlı kutu */
        .obs-container {
            background: rgba(10, 14, 23, 0.75); 
            border-left: 4px solid #00F5D4; /* OrbitLive Neon Mavi */
            border-radius: 8px;
            padding: 12px 18px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px); /* Cam bulanıklığı */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .callsign {
            font-size: 24px;
            font-weight: 700;
            color: #00F5D4;
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.4);
            margin: 0;
        }

        .username {
            font-size: 14px;
            color: #ccc;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 16px;
        }

        .label { color: #888; font-weight: 500; }
        .value { font-weight: 700; }
        .pink { color: #F15BB5; text-shadow: 0 0 5px rgba(241, 91, 181, 0.5); }
        .error-msg { color: #FF3366; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<!-- YAYINCININ EKRANINDA GÖRÜNECEK KUTU -->
<div class="obs-container" id="widget-box">
    <div class="header">
        <h2 class="callsign" id="w-callsign">LOADING...</h2>
        <span class="username" id="w-username">Waiting for data</span>
    </div>
    <div class="data-row">
        <span class="label">AIRCRAFT:</span>
        <span class="value" id="w-aircraft">---</span>
    </div>
    <div class="data-row">
        <span class="label">ALTITUDE:</span>
        <span class="value" id="w-alt">---</span>
    </div>
    <div class="data-row">
        <span class="label">SPEED:</span>
        <span class="value pink" id="w-spd">---</span>
    </div>
    <div class="data-row">
        <span class="label">ROUTE:</span>
        <span class="value" id="w-route">---</span>
    </div>
</div>

<script>
    // Vercel Sunucumuzdaki "Kurşun Geçirmez" Master Cache
    const API_URL = "https://orbtlive.vercel.app/api/flights";
    
    // URL'deki parametreleri yakala (Örn: obs.html?username=theWolfBey VEYA obs.html?callsign=PVA101)
    const urlParams = new URLSearchParams(window.location.search);
    const targetUsername = urlParams.get('username') ? urlParams.get('username').toLowerCase() : null;
    const targetCallsign = urlParams.get('callsign') ? urlParams.get('callsign').toLowerCase() : null;

    async function updateWidget() {
        if (!targetUsername && !targetCallsign) {
            document.getElementById('w-callsign').innerText = "ERROR";
            document.getElementById('w-username').innerHTML = "<span class='error-msg'>Missing ?username= or ?callsign= in URL</span>";
            return;
        }

        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            if (data.result) {
                // Binlerce uçak arasından yayıncının kendi uçağını bul
                let flight = data.result.find(f => 
                    (targetUsername && (f.username || "").toLowerCase() === targetUsername) ||
                    (targetCallsign && (f.callsign || "").toLowerCase() === targetCallsign)
                );

                if (flight) {
                    document.getElementById('w-callsign').innerText = flight.callsign;
                    document.getElementById('w-username').innerText = flight.username;
                    document.getElementById('w-aircraft').innerText = flight.aircraftName;
                    document.getElementById('w-alt').innerText = Math.round(flight.altitude) + " FT";
                    document.getElementById('w-spd').innerText = Math.round(flight.speed) + " KTS";
                    
                    let route = "Calculating...";
                    if (flight.originAirport !== "Loading" && flight.originAirport !== "N/A") {
                        route = `${flight.originAirport} ✈️ ${flight.destinationAirport}`;
                    }
                    document.getElementById('w-route').innerText = route;
                } else {
                    document.getElementById('w-callsign').innerText = "OFFLINE";
                    document.getElementById('w-username').innerText = targetUsername || targetCallsign;
                    document.getElementById('w-aircraft').innerText = "-";
                    document.getElementById('w-alt').innerText = "-";
                    document.getElementById('w-spd').innerText = "-";
                    document.getElementById('w-route').innerText = "Waiting for departure...";
                }
            }
        } catch (err) {
            console.error("Widget Error:", err);
        }
    }

    // İlk yüklendiğinde çalıştır ve her 15 saniyede bir canlandır
    updateWidget();
    setInterval(updateWidget, 15000);
</script>
</body>
</html>
